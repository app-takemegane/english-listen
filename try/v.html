<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>「v」の音くらべ</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 24px 20px 60px;
         background: #fffdf5; color: #333; line-height: 1.7; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { font-size: 16px; margin: 0 0 20px; color: #666; }
  button { display: block; width: 100%; margin: 14px 0; padding: 22px;
           font-size: 26px; font-weight: bold; border: none; border-radius: 18px;
           background: #ffd166; color: #333; box-shadow: 0 4px 0 #e0b44e; }
  button:active { transform: translateY(3px); box-shadow: none; }
  .memo { font-size: 15px; color: #888; margin: -6px 0 18px; }
</style>
</head>
<body>
<h1>「v」の音くらべ</h1>
<p>3つ聞いて、いちばん「ヴ」に近いものを教えてください。何度でも押せます。</p>

<button onclick="play('v-a')">あ を きく</button>
<div class="memo">いま アプリに 入っている音</div>

<button onclick="play('v-b')">い を きく</button>
<div class="memo">ゆっくり 立ち上がる音(低い響きを弱めた)</div>

<button onclick="play('v-c')">う を きく</button>
<div class="memo">最後に ほんの少し 母音を残した音</div>

<script>
  const a = new Audio();
  function play(name) { a.pause(); a.src = name + ".m4a"; a.play(); }
</script>
</body>
</html>
