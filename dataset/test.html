<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>発音データセット 確認ページ</title>
<style>
  body { font-family: -apple-system, "Noto Sans JP", sans-serif; margin: 0;
         padding: 20px 16px 60px; background: #fffdf5; color: #333; line-height: 1.6; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 8px; }
  .note { font-size: 14px; color: #777; margin: 0 0 16px; }
  .word { background: #fff; border-radius: 14px; padding: 12px 14px; margin: 10px 0;
          box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .head { display: flex; align-items: center; gap: 12px; }
  .spell { font-size: 24px; font-weight: bold; }
  .ipa { font-size: 17px; color: #c2410c; }
  .play { margin-left: auto; border: none; background: #ffd166; color: #333;
          font-size: 18px; font-weight: bold; border-radius: 12px; padding: 10px 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { border: none; border-radius: 10px; padding: 8px 12px; font-size: 16px;
          background: #e0f2fe; color: #075985; }
  .chip.vowel { background: #ffe4e6; color: #9f1239; }
  .chip small { display: block; font-size: 11px; opacity: .7; }
  #status { font-size: 14px; color: #555; background: #fff; border-radius: 10px; padding: 10px 12px; }
</style>
</head>
<body>
<h1>発音データセット 確認ページ</h1>
<p class="note">Chromebook と iPhone の両方で、下の音がすべて鳴るか確かめるためのページです。</p>
<div id="status">読み込み中…</div>

<h2>単語(試験生成分)</h2>
<div id="words"></div>

<h2>音素(39音・例単語で鳴らす)</h2>
<div id="phonemes" class="chips"></div>

<script>
const VOWELS = ["AA","AE","AH","AO","AW","AY","EH","ER","EY","IH","IY","OW","OY","UH","UW"];
const audio = new Audio();
function play(src) { audio.pause(); audio.src = src; audio.play().catch(e => {
  document.getElementById("status").textContent = "再生できませんでした: " + e.message;
}); }

Promise.all([
  fetch("words.json").then(r => r.json()),
  fetch("phonemes.json").then(r => r.json())
]).then(([words, phonemes]) => {
  const a = document.createElement("audio");
  document.getElementById("status").textContent =
    `単語 ${words.length}件 / 音素 ${phonemes.length}音を読み込みました。` +
    `このブラウザの mp3 対応: ${a.canPlayType("audio/mpeg") || "なし"}`;

  document.getElementById("words").innerHTML = words.map(w => `
    <div class="word">
      <div class="head">
        <span class="spell">${w.spelling}</span>
        <span class="ipa">/${w.ipa}/</span>
        <button class="play" onclick="play('${w.audio}')">▶ 単語</button>
      </div>
      <div class="chips">${w.phonemes.map(p => `
        <button class="chip ${VOWELS.includes(p.arpabet) ? "vowel" : ""}"
                onclick="play('${p.audio}')">${p.text}<small>${p.arpabet}</small></button>`).join("")}
      </div>
    </div>`).join("");

  document.getElementById("phonemes").innerHTML = phonemes.map(p => `
    <button class="chip ${VOWELS.includes(p.arpabet) ? "vowel" : ""}"
            onclick="play('${p.audio}')">${p.ipa}<small>${p.example}</small></button>`).join("");
}).catch(e => {
  document.getElementById("status").textContent = "読み込みに失敗しました: " + e.message;
});
</script>
</body>
</html>
