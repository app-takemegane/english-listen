<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>えいごのえほん</title>
  <meta name="description" content="幼児・小学生向け 英語えほん読み聞かせアプリ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="えいごのえほん">
  <meta name="theme-color" content="#f7941d">
</head>
<body>

  <!-- ═══════════ 本棚(ほんだな)画面 ═══════════ -->
  <div id="shelf-view" class="view">
    <header class="app-header">
      <div class="header-top">
        <div class="logo">
          <span class="logo-sun">☀️</span>
          <h1>えいごのえほん</h1>
        </div>
        <div class="coin-chip">🪙 <span id="coin-count">0</span></div>
      </div>
      <div class="mascot-row">
        <div class="mascot" id="mascot">
          <svg viewBox="0 0 100 100" width="52" height="52">
            <polygon points="30,32 34,10 50,26" fill="#f0a04b"/>
            <polygon points="70,32 66,10 50,26" fill="#f0a04b"/>
            <polygon points="34,29 36,16 46,26" fill="#ffb0a0"/>
            <polygon points="66,29 64,16 54,26" fill="#ffb0a0"/>
            <circle cx="50" cy="55" r="32" fill="#f0a04b"/>
            <circle cx="40" cy="50" r="4.5" fill="#4a3728"/>
            <circle cx="60" cy="50" r="4.5" fill="#4a3728"/>
            <ellipse cx="50" cy="60" rx="4.5" ry="3.5" fill="#e5735c"/>
            <path d="M50 63 Q50 70 41 71 M50 63 Q50 70 59 71" fill="none" stroke="#4a3728" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="20" y1="52" x2="34" y2="54" stroke="#4a3728" stroke-width="2"/>
            <line x1="20" y1="60" x2="34" y2="60" stroke="#4a3728" stroke-width="2"/>
            <line x1="80" y1="52" x2="66" y2="54" stroke="#4a3728" stroke-width="2"/>
            <line x1="80" y1="60" x2="66" y2="60" stroke="#4a3728" stroke-width="2"/>
          </svg>
        </div>
        <div class="speech-bubble" id="mascot-message">きょうは どの えほんに する?</div>
      </div>
    </header>

    <nav class="level-tabs" id="level-tabs">
      <button class="tab active" data-level="all">すべて</button>
      <button class="tab" data-level="1">レベル1</button>
      <button class="tab" data-level="2">レベル2</button>
    </nav>

    <main id="bookshelf" class="bookshelf"></main>

    <nav class="tab-bar">
      <button class="tab-item active" data-view="shelf"><span class="tab-icon">📚</span><span>ほんだな</span></button>
      <button class="tab-item" data-view="gacha"><span class="tab-icon">🎁</span><span>ごほうび</span></button>
      <button class="tab-item" data-view="records"><span class="tab-icon">⭐</span><span>きろく</span></button>
    </nav>
  </div>

  <!-- ═══════════ ごほうび(ガチャ)画面 ═══════════ -->
  <div id="gacha-view" class="view hidden">
    <header class="sub-header">
      <h2>🎁 ごほうびガチャ</h2>
      <div class="coin-chip">🪙 <span id="coin-count-gacha">0</span></div>
    </header>

    <main class="gacha-main">
      <div class="gacha-machine" id="gacha-machine">
        <svg viewBox="0 0 200 240" width="170">
          <circle cx="100" cy="90" r="72" fill="#dff0fa" stroke="#f7941d" stroke-width="8"/>
          <circle cx="72" cy="72" r="17" fill="#f06292"/>
          <circle cx="112" cy="60" r="17" fill="#ffd23f"/>
          <circle cx="132" cy="100" r="17" fill="#7cb95c"/>
          <circle cx="82" cy="112" r="17" fill="#4a9fd8"/>
          <rect x="40" y="158" width="120" height="60" rx="12" fill="#f7941d"/>
          <circle cx="100" cy="188" r="16" fill="#fff"/>
          <rect x="96" y="174" width="8" height="28" rx="4" fill="#e07b00"/>
        </svg>
      </div>
      <p class="gacha-note">えほんを よんだり クイズに せいかいすると コインが もらえるよ</p>
      <button id="btn-gacha" class="pill-btn orange big-btn">ガチャを まわす(🪙3まい)</button>

      <h3 class="collection-title">あつめた カード(<span id="card-count">0</span>/8)</h3>
      <div id="card-grid" class="card-grid"></div>
    </main>

    <nav class="tab-bar">
      <button class="tab-item" data-view="shelf"><span class="tab-icon">📚</span><span>ほんだな</span></button>
      <button class="tab-item active" data-view="gacha"><span class="tab-icon">🎁</span><span>ごほうび</span></button>
      <button class="tab-item" data-view="records"><span class="tab-icon">⭐</span><span>きろく</span></button>
    </nav>
  </div>

  <!-- ═══════════ きろく画面 ═══════════ -->
  <div id="records-view" class="view hidden">
    <header class="sub-header">
      <h2>⭐ きろく</h2>
      <div class="coin-chip">🪙 <span id="coin-count-records">0</span></div>
    </header>

    <main class="records-main" id="records-main"></main>

    <nav class="tab-bar">
      <button class="tab-item" data-view="shelf"><span class="tab-icon">📚</span><span>ほんだな</span></button>
      <button class="tab-item" data-view="gacha"><span class="tab-icon">🎁</span><span>ごほうび</span></button>
      <button class="tab-item active" data-view="records"><span class="tab-icon">⭐</span><span>きろく</span></button>
    </nav>
  </div>

  <!-- ═══════════ モード選択(えほんを開いたとき) ═══════════ -->
  <div id="mode-overlay" class="overlay hidden">
    <div class="mode-card">
      <div class="mode-cover"><img id="mode-cover" alt=""></div>
      <div class="mode-title-en" id="mode-title-en"></div>
      <div class="mode-title-ja" id="mode-title-ja"></div>
      <button id="btn-mode-listen" class="pill-btn orange big-btn">🎧 よみきかせ</button>
      <button id="btn-mode-quiz" class="pill-btn white big-btn">📝 クイズに ちょうせん</button>
      <button id="btn-mode-close" class="text-btn">とじる</button>
    </div>
  </div>

  <!-- ═══════════ えほんリーダー画面 ═══════════ -->
  <div id="reader-view" class="view hidden">
    <header class="reader-header">
      <button id="btn-back" class="icon-btn" aria-label="ほんだなにもどる">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>ほんだな</span>
      </button>
      <div id="reader-title" class="reader-title"></div>
      <button id="btn-ja" class="ja-btn" aria-label="にほんごをひょうじ">あ</button>
      <div id="page-indicator" class="page-indicator"></div>
    </header>

    <main class="reader-main">
      <div id="page-illustration" class="page-illustration"></div>
      <div id="page-text" class="page-text"></div>
    </main>

    <footer class="reader-controls">
      <button id="btn-prev" class="nav-btn" aria-label="まえのページ">
        <svg viewBox="0 0 24 24" width="34" height="34"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <button id="btn-replay" class="round-btn small" aria-label="もういちど">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 4v6h6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.6 10A8 8 0 1 1 4 14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>

      <button id="btn-play" class="round-btn big" aria-label="さいせい">
        <svg id="icon-play" viewBox="0 0 24 24" width="40" height="40"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" width="40" height="40" class="hidden"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
      </button>

      <button id="btn-auto" class="round-btn small" aria-label="じどうめくり">
        <span class="auto-label">auto</span>
      </button>

      <button id="btn-next" class="nav-btn" aria-label="つぎのページ">
        <svg viewBox="0 0 24 24" width="34" height="34"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </footer>

    <div id="finish-overlay" class="overlay hidden">
      <div id="confetti" class="confetti"></div>
      <div class="finish-card">
        <div class="finish-stars">⭐️⭐️⭐️</div>
        <p class="finish-en">Great job!</p>
        <p class="finish-ja">さいごまで よめたね! 🪙コインを 1まい ゲット!</p>
        <button id="btn-finish-quiz" class="pill-btn orange">📝 クイズに ちょうせん!</button>
        <button id="btn-read-again" class="pill-btn white">もういちど よむ</button>
        <button id="btn-to-shelf" class="text-btn">ほんだなに もどる</button>
      </div>
    </div>
  </div>

  <!-- ═══════════ クイズ画面 ═══════════ -->
  <div id="quiz-view" class="view hidden">
    <header class="reader-header">
      <button id="btn-quiz-back" class="icon-btn">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>やめる</span>
      </button>
      <div class="reader-title">📝 クイズ</div>
      <div id="quiz-progress" class="page-indicator"></div>
    </header>

    <main class="quiz-main">
      <div class="quiz-question-box">
        <button id="btn-quiz-sound" class="round-btn small" aria-label="もんだいをきく">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 9v6h4l6 5V4L8 9H4z" fill="currentColor"/><path d="M17 8 Q20 12 17 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
        <div id="quiz-question" class="quiz-question"></div>
      </div>
      <div id="quiz-choices" class="quiz-choices"></div>
      <div id="quiz-feedback" class="quiz-feedback"></div>
    </main>

    <div id="quiz-result-overlay" class="overlay hidden">
      <div id="quiz-confetti" class="confetti"></div>
      <div class="finish-card">
        <div id="quiz-result-stars" class="finish-stars"></div>
        <p id="quiz-result-en" class="finish-en"></p>
        <p id="quiz-result-ja" class="finish-ja"></p>
        <button id="btn-quiz-again" class="pill-btn orange">もういちど ちょうせん</button>
        <button id="btn-quiz-to-shelf" class="pill-btn white">ほんだなに もどる</button>
      </div>
    </div>
  </div>

  <!-- ═══════════ ガチャの結果 ═══════════ -->
  <div id="gacha-overlay" class="overlay hidden">
    <div id="gacha-confetti" class="confetti"></div>
    <div class="finish-card">
      <p class="finish-ja">カードを ゲット!</p>
      <div id="gacha-card" class="gacha-card"></div>
      <p id="gacha-card-name-en" class="finish-en"></p>
      <p id="gacha-card-name-ja" class="finish-ja"></p>
      <button id="btn-gacha-close" class="pill-btn orange">やったね!</button>
    </div>
  </div>

  <script src="js/books.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
